[package]
name = "anydb-adapter-surrealdb"
version = "0.1.0"
edition = "2021"
description = "AnyDB adapter for SurrealDB within fabric.db governed state fabric"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# placeholder for SurrealDB client
surrealdb = "1"