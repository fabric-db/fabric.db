[workspace]
members = [
  "crates/fabric-core",
  "crates/fabric-control-plane",
  "crates/fabric-sdk",
  "crates/fabric-runtime"
]

resolver = "2"

[workspace.package]
name = "fabric"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"